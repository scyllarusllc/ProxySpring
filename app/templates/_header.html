<header class="flex h-[72px] items-center justify-between border-b border-line px-7">
  <a class="flex items-center gap-2 text-lg font-bold tracking-tight" href="/">
    <svg class="size-7" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4c2 6 2 9 0 14 5-1 9 1 11 5-7 1-11 0-14 5-1-6-5-9-9-10 5-1 8-5 12-14z" fill="#587c60"/></svg>
    ProxySpring
  </a>
  <nav class="flex gap-5 text-xs text-muted" aria-label="Main">
    {% for href, label, icon in [('/', 'Product', 'fa-seedling'), ('/check', 'Check', 'fa-satellite-dish'), ('/privacy', 'Privacy', 'fa-shield-halved')] %}
    <a href="{{ href }}" class="inline-flex items-center gap-1.5 hover:text-ink {{ 'text-ink font-semibold' if path == href }}"{% if path == href %} aria-current="page"{% endif %}><i class="fa-solid {{ icon }}" aria-hidden="true"></i>{{ label }}</a>
    {% endfor %}
  </nav>
</header>
